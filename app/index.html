<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP meta fallback (report-first safe): mirrors the Content-Security-Policy
         in public/_headers for transports that ignore it (e.g. file:// preview).
         frame-ancestors is intentionally omitted — it is ignored in <meta> and
         only enforced via the header. style-src 'unsafe-inline' covers the
         React-injected view-transition <style> (StudioApp VT_CSS); script-src
         'wasm-unsafe-eval' keeps WASM streaming compile working in Chrome. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; manifest-src 'self'; upgrade-insecure-requests"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7f2" />
    <meta
      name="description"
      content="Merge, split, rearrange, compress and convert PDFs - 100% in your browser, fully offline. Your files never leave your device."
    />
    <title>Folio - PDF tools that stay on your device</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS installability: Safari ignores the manifest for home-screen
         icons and standalone mode, so these tags carry that weight. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Folio" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
