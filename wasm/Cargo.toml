[package]
name = "folio-wasm"
version = "0.1.0"
edition = "2021"
description = "Thin WASM API layer over the folio-engine Rust core (Lesson 10). No PDF logic here."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The real engine. All PDF semantics, validation, timing, and error
# behavior come from this crate unchanged (same ExecutionEngine, same
# operations, same error model as native/CLI).
folio-engine = { path = ".." }
# Minimal JS bindings: function calls, typed arrays, and JSON transport
# for the glue layer only. Never used by the engine core itself.
wasm-bindgen = "0.2"
js-sys = "0.3"
# Structured control plane (options in, summaries/events out). Binary PDF
# data always crosses as Uint8Array, never inside JSON.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
# Readable Rust panic messages in the browser console (dev-critical: else
# every glue/engine bug surfaces as bare `unreachable`). Tiny, no runtime.
console_error_panic_hook = "0.1"
